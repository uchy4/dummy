name: Deploy relay (Cloudflare Worker)

# Deploys bomb-shelter/relay to Cloudflare Workers so hosts can open
# internet rooms. Runs only when dispatched manually. Needs repository
# secrets:
#   CLOUDFLARE_API_TOKEN   (token with the "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  (optional if the token sees exactly one account)

on:
  workflow_dispatch:
  # workflow_dispatch only registers on the default branch, so also fire on
  # pushes touching this file — edit the touch counter below to redeploy.
  push:
    branches: ["claude/bomb-shelter-game-4rwbvd", "main"]
    paths:
      - ".github/workflows/deploy-relay.yml"

# deploy touch counter: 2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bomb-shelter/relay
