name: Build slim web template

# Compiles a size-optimized, single-threaded, 2D-only Godot web export
# template and publishes it to the fixed 'bomb-shelter-webtpl' release.
# The main build's "Export slim Web build" step consumes it as an ALTERNATE
# artifact (bomb-shelter-web-slim.zip) alongside the standard web build.
# Runs only when dispatched manually or when this file changes — it takes
# ~45 minutes and only needs rerunning on a Godot version bump.

on:
  workflow_dispatch:
  push:
    branches: ["claude/bomb-shelter-game-4rwbvd", "main"]
    paths:
      - ".github/workflows/build-web-template.yml"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Clone Godot source
        run: |
          git clone --depth 1 --branch "${GODOT_VERSION}-stable" \
            https://github.com/godotengine/godot.git /tmp/godot

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"

      - name: Install SCons
        run: pip3 install scons

      - name: Build size-optimized web template (single-threaded, 2D-only)
        run: |
          cd /tmp/godot
          scons platform=web target=template_release threads=no \
            production=yes optimize=size disable_3d=yes \
            module_text_server_adv_enabled=no module_text_server_fb_enabled=yes \
            module_gltf_enabled=no module_csg_enabled=no module_gridmap_enabled=no \
            module_openxr_enabled=no module_webxr_enabled=no module_mobile_vr_enabled=no \
            module_raycast_enabled=no module_lightmapper_rd_enabled=no \
            module_enet_enabled=no module_upnp_enabled=no
          ls -la bin

      - name: Publish template to the bomb-shelter-webtpl release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create bomb-shelter-webtpl \
            --title "Slim web export template (Godot ${GODOT_VERSION})" \
            --notes "Size-optimized single-threaded 2D-only web export template. Consumed by the WebSlim preset in the main build." \
            || true
          gh release upload bomb-shelter-webtpl /tmp/godot/bin/godot.web.template_release.wasm32.nothreads.zip --clobber
