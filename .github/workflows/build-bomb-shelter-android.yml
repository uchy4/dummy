name: Build Bomb Shelter (Android APK)

on:
  push:
    branches: ["claude/bomb-shelter-game-4rwbvd", "main"]
    paths:
      - "bomb-shelter/**"
      - ".github/workflows/build-bomb-shelter-android.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and export templates
        run: |
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: godot --headless --path bomb-shelter --import || true

      - name: Configure Android export (keystore + editor settings)
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.4.tres" "$HOME/.config/godot/editor_settings-4.tres"
          # Also set the keystore directly in the preset - the most reliable
          # thing headless export reads.
          printf '\nkeystore/debug="%s"\nkeystore/debug_user="androiddebugkey"\nkeystore/debug_password="android"\n' \
            "$HOME/debug.keystore" >> bomb-shelter/export_presets.cfg
          tail -5 bomb-shelter/export_presets.cfg

      - name: Export debug APK
        run: |
          mkdir -p build
          set +e
          godot --headless --path bomb-shelter --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/bomb-shelter.apk" --verbose 2>&1 | tee /tmp/export.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] || [ ! -f build/bomb-shelter.apk ]; then
            echo "===== export failed (exit $code) — diagnostics ====="
            echo "--- editor settings ---"
            cat "$HOME/.config/godot/editor_settings-4.4.tres" || true
            echo "--- export templates ---"
            ls -la "$HOME/.local/share/godot/export_templates/"*/ | head -40 || true
            echo "--- preset ---"
            cat bomb-shelter/export_presets.cfg
            echo "--- errors in log ---"
            grep -iE "error|invalid|missing|keystore|template" /tmp/export.log | head -40 || true
            exit 1
          fi
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: bomb-shelter-apk
          path: build/bomb-shelter.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bomb-shelter-build-${{ github.run_number }}"
          gh release create "$TAG" build/bomb-shelter.apk \
            --target "${{ github.sha }}" \
            --title "Bomb Shelter Android build #${{ github.run_number }}" \
            --notes "Debug APK built from \`${{ github.ref_name }}\` @ ${{ github.sha }}.

          **Install on Android:** download \`bomb-shelter.apk\` below, open it, and allow installing from unknown sources when prompted. Single-player with touch controls on phones; 2-4 players on keyboard on desktop."
