name: Build Bomb Shelter (Android APK)

on:
  push:
    branches: ["claude/bomb-shelter-game-4rwbvd", "main"]
    paths:
      - "bomb-shelter/**"
      - ".github/workflows/build-bomb-shelter-android.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and export templates
        run: |
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: godot --headless --path bomb-shelter --import || true

      - name: Headless smoke test (boot the game in 2D and 2.5D, fail on script errors)
        env:
          BOMB_SHELTER_SMOKE: "1"
        run: |
          for MODE in 0 1; do
            BOMB_SHELTER_SMOKE_3D=$MODE timeout 15 godot --headless --path bomb-shelter 2>&1 | tee "/tmp/smoke_$MODE.log" || true
            if grep -qE "SCRIPT ERROR|Parse Error|Compile Error|Failed to instantiate|Invalid call|Nonexistent function" "/tmp/smoke_$MODE.log"; then
              echo "===== SMOKE TEST FAILED (mode_3d=$MODE) — script errors at runtime ====="
              grep -nE "SCRIPT ERROR|Parse Error|Compile Error|ERROR|   at:" "/tmp/smoke_$MODE.log" | head -80
              exit 1
            fi
            echo "Smoke test passed for mode_3d=$MODE."
          done

      - name: Configure Android export (keystore + editor settings)
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.4.tres" "$HOME/.config/godot/editor_settings-4.tres"
          # Also set the keystore directly in BOTH presets - the most reliable
          # thing headless export reads.
          python3 - <<'PYEOF'
          import os
          p = 'bomb-shelter/export_presets.cfg'
          s = open(p).read()
          block = ('\nkeystore/debug="%s/debug.keystore"'
                   '\nkeystore/debug_user="androiddebugkey"'
                   '\nkeystore/debug_password="android"\n') % os.environ['HOME']
          for sect in ('[preset.0.options]', '[preset.1.options]'):
              s = s.replace(sect, sect + block)
          open(p, 'w').write(s)
          print('keystore injected into both presets')
          PYEOF

      - name: Export debug APKs (2D and 3D flavors)
        run: |
          mkdir -p build
          for PRESET in Android Android3D; do
            case "$PRESET" in
              Android) OUT="bomb-shelter-2d.apk" ;;
              *) OUT="bomb-shelter-3d.apk" ;;
            esac
            set +e
            godot --headless --path bomb-shelter --export-debug "$PRESET" \
              "$GITHUB_WORKSPACE/build/$OUT" 2>&1 | tee /tmp/export.log | tail -20
            set -e
            if [ ! -f "build/$OUT" ]; then
              echo "===== export failed for $PRESET — diagnostics ====="
              grep -iE "error|invalid|missing|keystore|template|sdk|java" /tmp/export.log | head -60 || true
              exit 1
            fi
          done
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: bomb-shelter-apks
          path: build/*.apk

      - name: Publish release with both APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bomb-shelter-build-${{ github.run_number }}"
          gh release create "$TAG" build/bomb-shelter-2d.apk build/bomb-shelter-3d.apk \
            --target "${{ github.sha }}" \
            --title "Bomb Shelter Android build #${{ github.run_number }}" \
            --notes "Debug APKs built from \`${{ github.ref_name }}\` @ ${{ github.sha }}.

          Two flavors that install side by side: \`bomb-shelter-2d.apk\` (classic flat look) and \`bomb-shelter-3d.apk\` (KayKit 2.5D). Both can host a match over local Wi-Fi and join one another's games from the menu; phones without the app join from a browser via the QR code."
