name: Build Bomb Shelter (Android APK)

on:
  push:
    branches: ["claude/bomb-shelter-game-4rwbvd", "main"]
    paths:
      - "bomb-shelter/**"
      - ".github/workflows/build-bomb-shelter-android.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and export templates
        run: |
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Stamp build number (in-app update check compares against releases)
        run: |
          sed -i "s/const BUILD := 0/const BUILD := ${{ github.run_number }}/" \
            bomb-shelter/scripts/build_info.gd
          grep "const BUILD" bomb-shelter/scripts/build_info.gd

      - name: Import project
        run: godot --headless --path bomb-shelter --import || true

      - name: Headless smoke test (boot the game, fail on script errors)
        env:
          BOMB_SHELTER_SMOKE: "1"
        run: |
          timeout 15 godot --headless --path bomb-shelter 2>&1 | tee /tmp/smoke.log || true
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error|Failed to instantiate|Invalid call|Nonexistent function" /tmp/smoke.log; then
            echo "===== SMOKE TEST FAILED — script errors at runtime ====="
            grep -nE "SCRIPT ERROR|Parse Error|Compile Error|ERROR|   at:" /tmp/smoke.log | head -80
            exit 1
          fi
          echo "Smoke test passed."

      - name: Export Web build (engine client, served by hosts at /g/)
        run: |
          mkdir -p build/web
          set +e
          godot --headless --path bomb-shelter --export-release "Web" \
            "$GITHUB_WORKSPACE/build/web/index.html" 2>&1 | tee /tmp/export_web.log | tail -20
          set -e
          if [ ! -f build/web/index.wasm ]; then
            echo "===== web export failed — diagnostics ====="
            grep -iE "error|invalid|missing|template" /tmp/export_web.log | head -60 || true
            exit 1
          fi
          # Patch the export to run outside a browser "secure context"
          # (plain-http LAN serving) — see bomb-shelter/ci/patch_web_shell.py.
          python3 bomb-shelter/ci/patch_web_shell.py build/web
          # Pre-gzipped copies ride inside the APKs (include_filter web_pack/*);
          # NetHub serves them with Content-Encoding: gzip so joining from a
          # browser downloads ~12 MB instead of ~40 MB.
          mkdir -p bomb-shelter/web_pack
          for f in build/web/*; do
            gzip -9 -c "$f" > "bomb-shelter/web_pack/$(basename "$f").gz"
          done
          (cd build/web && zip -qr ../bomb-shelter-web.zip .)
          ls -la bomb-shelter/web_pack

      - name: Export slim Web build (size-optimized custom template, when published)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download bomb-shelter-webtpl -p "webtpl-${GODOT_VERSION}.zip" -D /tmp/webtpl; then
            echo "No slim web template for Godot ${GODOT_VERSION} published yet (run the 'Build slim web template' workflow once) — skipping."
            exit 0
          fi
          # The WebSlim preset expects the standard template filename.
          mv "/tmp/webtpl/webtpl-${GODOT_VERSION}.zip" /tmp/webtpl/godot.web.template_release.wasm32.nothreads.zip
          mkdir -p build/web-slim
          set +e
          godot --headless --path bomb-shelter --export-release "WebSlim" \
            "$GITHUB_WORKSPACE/build/web-slim/index.html" 2>&1 | tail -20
          set -e
          if [ ! -f build/web-slim/index.wasm ]; then
            echo "slim export failed — release keeps the standard web build only"
            exit 0
          fi
          python3 bomb-shelter/ci/patch_web_shell.py build/web-slim || { echo "patch failed on slim build — skipping"; rm -rf build/web-slim; exit 0; }
          (cd build/web-slim && zip -qr ../bomb-shelter-web-slim.zip .)
          ls -la build/bomb-shelter-web-slim.zip

      - name: Configure Android export (keystore + editor settings)
        run: |
          # ONE stable signing key (committed to the repo): every build signs
          # with it, so Android installs new APKs over old ones as in-place
          # updates. Never regenerate it — a key change forces every device
          # to uninstall/reinstall once.
          keytool -importkeystore \
            -srckeystore bomb-shelter/ci/debug-signing.p12 -srcstoretype PKCS12 \
            -srcstorepass android -srcalias androiddebugkey \
            -destkeystore "$HOME/debug.keystore" -deststoretype JKS \
            -deststorepass android -destkeypass android -noprompt
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.7.tres" "$HOME/.config/godot/editor_settings-4.tres"
          # Also set the keystore directly in the preset - the most reliable
          # thing headless export reads.
          python3 - <<'PYEOF'
          import os, re
          p = 'bomb-shelter/export_presets.cfg'
          s = open(p).read()
          run = os.environ['GITHUB_RUN_NUMBER']
          block = ('\nkeystore/debug="%s/debug.keystore"'
                   '\nkeystore/debug_user="androiddebugkey"'
                   '\nkeystore/debug_password="android"\n') % os.environ['HOME']
          # Rising versionCode per CI run so Android always treats a newer
          # APK as an upgrade (installs over the old one, never a downgrade).
          block += ('version/code=%s\nversion/name="build %s"\n' % (run, run))
          s = re.sub(r'^version/(code|name)=.*\n', '', s, flags=re.M)
          for sect in ('[preset.0.options]',):
              s = s.replace(sect, sect + block)
          open(p, 'w').write(s)
          print('keystore + version %s injected' % run)
          PYEOF

      - name: Export debug APK
        run: |
          mkdir -p build
          set +e
          godot --headless --path bomb-shelter --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/bomb-shelter-2d.apk" 2>&1 | tee /tmp/export.log | tail -20
          set -e
          if [ ! -f build/bomb-shelter-2d.apk ]; then
            echo "===== export failed — diagnostics ====="
            grep -iE "error|invalid|missing|keystore|template|sdk|java" /tmp/export.log | head -60 || true
            exit 1
          fi
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: bomb-shelter-apks
          path: |
            build/*.apk
            build/bomb-shelter-web*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bomb-shelter-build-${{ github.run_number }}"
          ASSETS="build/bomb-shelter-2d.apk build/bomb-shelter-web.zip"
          if [ -f build/bomb-shelter-web-slim.zip ]; then ASSETS="$ASSETS build/bomb-shelter-web-slim.zip"; fi
          gh release create "$TAG" $ASSETS \
            --target "${{ github.sha }}" \
            --title "Bomb Shelter Android build #${{ github.run_number }}" \
            --notes "Debug APK built from \`${{ github.ref_name }}\` @ ${{ github.sha }}.

          \`bomb-shelter-2d.apk\` hosts a match over local Wi-Fi and joins other hosts from the menu; phones without the app join from a browser via the QR code — the lightweight touch client, or the FULL GAME engine build the host serves at \`/g/\` (attached as \`bomb-shelter-web.zip\`, plus \`bomb-shelter-web-slim.zip\` when the size-optimized engine template is published)."
